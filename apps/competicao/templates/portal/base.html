{% load static %}
<!doctype html>
<html lang="pt-br" class="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal Federativo{% endblock %} — CHAMPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>

<body class="bg-white dark:bg-gray-900 min-h-screen flex flex-col antialiased">

<!-- Navbar -->
<nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex items-center h-14">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-yellow-400/10 border border-yellow-400/25 flex items-center justify-center">
          <i class="ti ti-trophy text-yellow-500 text-sm"></i>
        </div>
        <span class="section-heading text-xl text-gray-900 dark:text-white tracking-wider">CHAMPS</span>
        <span class="text-xs text-gray-400 dark:text-gray-600 hidden sm:block">Portal Público</span>
      </div>
    </div>
  </div>
</nav>

<!-- Conteúdo da página -->
<main class="flex-1">
  {% block conteudo %}{% endblock %}
</main>

<!-- Footer -->
<footer class="bg-gray-50 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-8 mt-12">
  <div class="max-w-6xl mx-auto px-4 text-center">
    <div class="flex items-center justify-center gap-2 mb-2">
      <i class="ti ti-trophy text-yellow-500 text-sm"></i>
      <span class="section-heading text-lg text-gray-600 dark:text-gray-400 tracking-wider">CHAMPS</span>
    </div>
    <p class="text-xs text-gray-400 dark:text-gray-600">Plataforma de Gestão Federativa Profissional</p>
  </div>
</footer>

</body>
</html>
