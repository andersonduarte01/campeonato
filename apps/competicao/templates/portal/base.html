{% load static %}
<!doctype html>
<html lang="pt-br" data-theme="luxury">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal Federativo{% endblock %} — CHAMPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/dist/full.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    .font-title   { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .font-sports  { font-family: 'Oswald', sans-serif; font-weight: 700; }
    .stat-number  { font-family: 'Oswald', sans-serif; font-weight: 700; line-height: 1; }
    .section-heading { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.08em; }
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-base-100 min-h-screen flex flex-col">

<!-- Navbar -->
<nav class="bg-base-200 border-b border-base-300 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex items-center justify-between h-14 gap-4">
      <a href="{% url 'competicao:portal_home' %}" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-warning/10 border border-warning/25 flex items-center justify-center">
          <i class="bi bi-trophy-fill text-warning text-sm"></i>
        </div>
        <span class="font-title text-xl text-base-content tracking-wider">CHAMPS</span>
        <span class="text-xs text-base-content/30 hidden sm:block">Portal Federativo</span>
      </a>

      <div class="flex items-center gap-1 text-sm">
        <a href="{% url 'competicao:portal_home' %}"
           class="px-3 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300 transition-colors">
          Início
        </a>
        <a href="{% url 'competicao:portal_publicacao_lista' %}?tipo=noticia"
           class="px-3 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300 transition-colors">
          Notícias
        </a>
        <a href="{% url 'competicao:portal_publicacao_lista' %}?tipo=comunicado"
           class="px-3 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300 transition-colors">
          Comunicados
        </a>
        <a href="{% url 'competicao:portal_publicacao_lista' %}?tipo=regulamento"
           class="px-3 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300 transition-colors hidden sm:block">
          Regulamentos
        </a>
        <a href="{% url 'competicao:portal_publicacao_lista' %}?tipo=documento_oficial"
           class="px-3 py-1.5 rounded-lg text-base-content/60 hover:text-base-content hover:bg-base-300 transition-colors hidden md:block">
          Documentos
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- Conteúdo da página -->
<main class="flex-1">
  {% block conteudo %}{% endblock %}
</main>

<!-- Footer -->
<footer class="bg-base-200 border-t border-base-300 py-8 mt-12">
  <div class="max-w-6xl mx-auto px-4 text-center">
    <div class="flex items-center justify-center gap-2 mb-2">
      <i class="bi bi-trophy-fill text-warning text-sm"></i>
      <span class="font-title text-lg text-base-content/60 tracking-wider">CHAMPS</span>
    </div>
    <p class="text-xs text-base-content/30">Plataforma de Gestão Federativa Profissional</p>
  </div>
</footer>

</body>
</html>
