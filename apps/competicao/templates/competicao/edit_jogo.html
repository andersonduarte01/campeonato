{% extends 'base/indice.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block titulo %}Criar Liga{% endblock %}
{% block conteudo %}

<div class="container" style="margin-top:20px;">
  <div class="card">
  <div class="card-body">
    <h4 class="card-title text-center">Resultado Jogo</h4>
    <hr>
    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-outline-primary">Salvar</button>
    </form>
  </div>
</div>
</div>

{% endblock %}
