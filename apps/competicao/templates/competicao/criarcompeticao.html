{% extends 'base/indice.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block titulo %}Criar Competição{% endblock %}
{% block conteudo %}

<div class="container" style="margin-top:20px;">
  <div class="card">
  <div class="card-body">
    <h4 class="card-title text-center">Criar Competição</h4>
    <hr>
    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <hr>
    <div class="d-grid gap-2">
      <button type="submit" class="btn btn-outline-primary">Criar</button>
    </div>
    </form>
  </div>
</div>
</div>
{% endblock %}
