{% extends 'base/indice.html' %}
{% block titulo %}Editar Árbitro — {{ arbitro.nome }}{% endblock %}

{% block conteudo %}
<div class="container mt-4" style="max-width:500px">
  <div class="card">
    <div class="card-header fw-semibold">
      <i class="bi bi-person-badge"></i> Editar Árbitro
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Nome *</label>
          {{ form.nome }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Categoria</label>
          {{ form.categoria }}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
          <a href="{% url 'competicao:arbitro_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
