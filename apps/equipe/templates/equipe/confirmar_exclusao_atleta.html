{% extends 'base/indice.html' %}
{% block titulo %}Excluir Atleta{% endblock %}

{% block conteudo %}
<div class="p-4 md:p-6 max-w-md mx-auto">
  <div class="card bg-base-200 border border-error/40">
    <div class="px-5 py-3 border-b border-error/40 bg-error/10 flex items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill text-error"></i>
      <h1 class="font-bold text-sm text-error">Confirmar Exclusão</h1>
    </div>
    <div class="card-body p-5">
      <p class="text-sm">
        Tem certeza que deseja excluir o atleta <strong>{{ atleta.nome }}</strong>?
      </p>
      <p class="text-xs text-base-content/50 mt-1">
        <i class="bi bi-shield"></i> Equipe: {{ atleta.equipe.nome_equipe }}
      </p>
      <form method="post" class="flex gap-2 mt-5">
        {% csrf_token %}
        <button type="submit" class="btn btn-error flex-1">
          <i class="bi bi-trash"></i> Excluir
        </button>
        <a href="{% url 'equipe:detalhe' atleta.equipe.pk %}" class="btn btn-ghost">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
