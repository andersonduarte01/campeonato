{% extends 'base/indice.html' %}
{% block titulo %}Excluir Equipe{% endblock %}

{% block conteudo %}
<div class="container mt-4" style="max-width: 480px;">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white">
      <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar Exclusão</h5>
    </div>
    <div class="card-body">
      <p>Tem certeza que deseja excluir a equipe <strong>{{ equipe.nome_equipe }}</strong>?</p>
      <p class="text-danger small">Esta ação também removerá todos os atletas cadastrados.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Excluir</button>
          <a href="{% url 'equipe:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
