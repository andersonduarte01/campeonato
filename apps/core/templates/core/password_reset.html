{% extends 'base/indice.html' %}
{% block titulo %}Recuperar Senha{% endblock %}

{% block conteudo %}
<div class="p-4 md:p-6 max-w-md mx-auto">
  <div class="card bg-base-200 border border-base-300">
    <div class="px-5 py-3 border-b border-base-300 flex items-center gap-2">
      <i class="bi bi-envelope-at text-warning text-sm"></i>
      <h1 class="font-bold text-sm">Recuperar Senha</h1>
    </div>
    <div class="card-body p-5">
      <p class="text-sm text-base-content/60 mb-4">
        Digite seu e-mail cadastrado. Você receberá um link para redefinir sua senha.
      </p>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="label py-0 mb-1">
            <span class="label-text font-semibold text-sm">E-mail</span>
          </label>
          <input type="email" name="email" class="input input-bordered w-full" required autofocus placeholder="seu@email.com">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="btn btn-warning flex-1">Enviar link</button>
          <a href="{% url 'core:login' %}" class="btn btn-ghost">Voltar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
