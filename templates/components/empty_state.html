<div class="text-center py-14 flex flex-col items-center gap-3">
  <div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-1">
    <i class="ti ti-{{ icon|default:'inbox' }} text-3xl text-gray-300 dark:text-gray-600"></i>
  </div>
  <p class="font-semibold text-gray-600 dark:text-gray-400 text-sm">{{ title }}</p>
  {% if subtitle %}
  <p class="text-xs text-gray-400 dark:text-gray-500 max-w-xs leading-relaxed">{{ subtitle }}</p>
  {% endif %}
  {% if cta_url %}
  <a href="{{ cta_url }}" class="btn btn-outline btn-sm mt-1 gap-1.5">
    <i class="ti ti-circle-plus text-sm"></i>
    {{ cta_label|default:"Criar" }}
  </a>
  {% endif %}
</div>
